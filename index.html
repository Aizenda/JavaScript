<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習RWD、Html DOM、JaJavaScript。</title>
    <link rel="stylesheet" href="RWD.css">
</head>
<body>
    <header>
        <h1>我的練習網站</h1>
        <button class="menu-toggle">☰</button>
        <nav>
            <ul>
                <li><a href="#home">首頁</a></li>
                <li><a href="#about">關於我們</a></li>
                <li><a href="#services">服務</a></li>
                <li><a href="#contact">聯繫我們</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>歡迎來到我的網站</h2>
            <p>這是一個練習網站。</p>
            <button id="random-project">顯示隨機練習項目</button>
            <p id="project-output"></p>
            <div id="calculator" style="display: none;">
                <h2>簡單計算機</h2>
                <input type="number" id="num1" placeholder="輸入第一個數字">
                <input type="number" id="num2" placeholder="輸入第二個數字">
                <select id="operator">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
                <button id="calculate">計算</button>
                <p id="result"></p>
            </div>
        </section>

        <section id="about">
            <h2>關於我</h2>
            <p>我是一個努力學習的，希望成為軟體工程師的人。</p>
        </section>

        <section id="services">
            <h2>我的練習</h2>
            <p>我透過一個簡單的網站，練習RWD、Html DOM、JaJavaScript。</p>
        </section>
    </main>

    <footer>
        <p>&copy; 我的練習網站</p>
    </footer>

    <script src="RWD.js"></script>
</body>
</html>
